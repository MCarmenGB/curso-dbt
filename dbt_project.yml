name: 'curso_data_engineering'
version: '1.0.0'
profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets: ["target", "dbt_packages"]

vars:
  budget_start_date: '2020-01-01'
  low_stock_threshold: 10

on-run-end:
  - "{{ log_run_summary(results) }}"

models:
  curso_data_engineering:
    +transient: false

    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['staging']
      sql_server_dbo:
        +schema: sql_server_dbo
      google_sheets:
        +schema: google_sheets

    silver:
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +tags: ['silver']
      sql_server_dbo:
        +schema: sql_server_dbo
      google_sheets:
        +schema: google_sheets

    gold:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +tags: ['gold']
      intermediate:
        +materialized: view
        +schema: intermediate
        +access: private
        int_orders__enriched:
          +group: core
        int_order_items__priced:
          +group: core
        int_events__pivoted_by_session:
          +group: product
      core:
        +schema: core
        +tags: ['core']
        +group: core
        +access: public
        +meta:
          owner: equipo-datos-core
      marketing:
        +schema: marketing
        +tags: ['marketing']
        +group: marketing
        +access: public
        +meta:
          owner: equipo-marketing-analytics
      product:
        +schema: product
        +tags: ['product']
        +group: product
        +access: public
        +meta:
          owner: equipo-producto

seeds:
  curso_data_engineering:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    country_codes:
      +column_types:
        country_code: varchar(2)
        country_name: varchar(100)
        continent: varchar(50)

snapshots:
  curso_data_engineering:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: snapshots
    +transient: false